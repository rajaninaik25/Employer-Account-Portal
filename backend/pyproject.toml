[project]
name = "backend"
version = "0.1.0"
description = "Employer Account Portal backend — FastAPI modular monolith"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.121,<1",
    "uvicorn[standard]>=0.38,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "httpx2>=2,<3",
    "ruff>=0.14,<1",
    "mypy>=1.19,<2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
